[package]
name = "ygo-arbiter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matches between Yu-Gi-Oh bots: the bot protocol, what each player sees, game records"

[dependencies]
ygo-core = { path = "../ygo-core" }
ygo-cards = { path = "../ygo-cards" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
mimalloc = { version = "0.1", default-features = false }
