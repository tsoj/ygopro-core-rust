[workspace]
resolver = "2"
members = ["ygo-core", "ygo-cards", "ygo-diff", "ygo-arbiter"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
debug = 1
# (thin LTO, and the engine in one codegen unit: 10-20% faster, the same build time; fat LTO with one
# codegen unit is ~10% faster still but takes ~50 minutes)
lto = "thin"

[profile.release.package.ygo-core]
codegen-units = 1
